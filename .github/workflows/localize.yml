name: Beelden lokaal en klein maken
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq webp ffmpeg && pip install -q pillow
      - run: tools/localize.sh
      - run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add assets && git commit -m "Beelden en video's lokaal, als WebP en kleinere MP4" && git push || echo "niets nieuw"
